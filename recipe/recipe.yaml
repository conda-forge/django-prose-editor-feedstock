schema_version: 1

context:
  name: django-prose-editor
  version: "0.29.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/django_prose_editor-${{ version }}.tar.gz
  sha256: 8daaa9a03d6f5a50b5bfc8355bc9b5003ee9a7ade7c9deb9609c1c7117d79ca5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - django >=4.2
    - django-js-asset >=5.0a1

tests:
  - python:
      imports:
        - django_prose_editor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Prose editor for the Django admin based on ProseMirror
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/matthiask/django-prose-editor/

extra:
  recipe-maintainers:
    - thewchan
